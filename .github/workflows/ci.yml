name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-compile:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint dependencies
        run: pip install ruff

      - name: Run ruff linter
        run: |
          ruff check . \
            --exclude .venv,__pycache__,outputs,uploads,models \
            --select E,W,F,I \
            --ignore E501

      - name: Python syntax check (all modules)
        run: |
          python -m py_compile config.py
          python -m py_compile detector.py
          python -m py_compile main.py
          python -m py_compile utils/video_utils.py
          python -m py_compile utils/helpers.py
          python -m py_compile utils/logger.py
          python -m py_compile utils/download_weights.py
          python -m py_compile utils/whatsapp_notifier.py
          python -m py_compile link_whatsapp.py
          echo "All modules compiled successfully."

  test-config:
    name: Smoke-test Config & Utils
    runs-on: ubuntu-latest
    needs: lint-and-compile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runtime dependencies (CPU-only, no GPU)
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics opencv-python-headless numpy pillow pytest requests

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      - name: Smoke-test config module
        run: |
          python - <<'EOF'
          from config import config
          assert config.CONFIDENCE_THRESHOLD == 0.35
          assert config.IOU_THRESHOLD == 0.45
          assert config.IMAGE_SIZE in (0, 640)
          assert config.get_image_size() in (320, 416, 640)
          device = config.get_device()
          assert device in ("cuda", "cpu")
          print(f"[OK] Config loaded. Device: {device}")
          EOF

      - name: Smoke-test utils imports
        run: |
          python - <<'EOF'
          from utils.logger import logger, get_logger
          from utils.helpers import get_device_info, encode_image_base64, get_current_timestamp
          from utils.video_utils import print_banner, save_detection_log
          logger.info("Logger OK")
          ts = get_current_timestamp()
          assert len(ts) > 0
          info = get_device_info("cpu")
          assert info["device"] == "cpu"
          print("[OK] All utils imported and smoke-tested.")
          EOF
